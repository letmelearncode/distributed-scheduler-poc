---
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: 'kafka.server<type=(.+), name=(.+)><>Value'
    name: kafka_server_$1_$2
    type: GAUGE
  - pattern: 'kafka.server<type=(.+), name=(.+), (.+)><>Value'
    name: kafka_server_$1_$2_$3
    type: GAUGE
  - pattern: 'kafka.consumer<type=(.+), name=(.+)><>Value'
    name: kafka_consumer_$1_$2
    type: GAUGE
  - pattern: 'kafka.producer<type=(.+), name=(.+)><>Value'
    name: kafka_producer_$1_$2
    type: GAUGE
  - pattern: 'kafka.coordinator<type=(.+), name=(.+)><>Value'
    name: kafka_coordinator_$1_$2
    type: GAUGE