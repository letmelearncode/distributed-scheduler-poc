spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler_poc
spring.datasource.username=postgres
spring.datasource.password=postgres
# Pool sizing: Quartz uses its own internal pool of this size (quartzDS) AND the Spring
# datasource bean is this size. In "both" mode that is 2x this value in one JVM, so keep it
# well under Postgres max_connections=200 (was 50, which combined with Quartz's second pool
# and leftover hung JVMs caused "too many clients").
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=5

# --- Fair-comparison tuning: both schedulers get 50 worker threads ---
# Quartz worker threads (also sizes its internal quartzDS pool via maximum-pool-size).
quartz.thread-count=50
# db-scheduler worker threads (default is only 10) + SKIP LOCKED clustering strategy.
db-scheduler.threads=50
db-scheduler.polling-strategy=lock-and-fetch
db-scheduler.polling-interval=1s
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=scheduler-poc
kafka.topics.input=scheduled-jobs-input
kafka.topics.output=scheduled-jobs-output
kafka.topics.dlq=scheduled-jobs-dlq
kafka.batch.size=1000

benchmark.job-count=200000
benchmark.scheduler=both
benchmark.kafka.bootstrap-servers=localhost:9092
# When true the app stays up after the run so Prometheus can keep scraping metrics.
benchmark.keep-alive=false

# --- Observability: expose metrics for Prometheus to scrape ---
server.port=8080
management.endpoints.web.exposure.include=prometheus,health,info,metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=scheduler-benchmark

logging.level.com.example=DEBUG
logging.level.org.quartz=INFO
logging.level.com.db_scheduler=INFO
logging.level.org.springframework.kafka=INFO

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true